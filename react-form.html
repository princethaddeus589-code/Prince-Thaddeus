<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form | Prince Thaddeus</title>

  <!-- React & ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contact-form {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .contact-form h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #38bdf8;
      font-size: 1.8rem;
    }

    .contact-form p.subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      background: #0ea5e9;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function ContactForm() {
      const [formData, setFormData] = useState({
        name: "",
        email: "",
        message: ""
      });

      const [status, setStatus] = useState({ type: "", message: "" });
      const [loading, setLoading] = useState(false);

      const handleChange = (e) => {
        setFormData({
          ...formData,
          [e.target.name]: e.target.value
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();

        // Simple validation
        if (!formData.name.trim() || !formData.email.trim() || !formData.message.trim()) {
          setStatus({ type: "error", message: "Please fill in all fields." });
          return;
        }

        // Email format check
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(formData.email)) {
          setStatus({ type: "error", message: "Please enter a valid email address." });
          return;
        }

        setLoading(true);
        setStatus({ type: "", message: "" });

        // Simulate sending (you can later connect EmailJS or Formspree)
        setTimeout(() => {
          console.log("Form Data:", formData);
          setStatus({ 
            type: "success", 
            message: "Message sent successfully! I will get back to you soon." 
          });
          setFormData({ name: "", email: "", message: "" });
          setLoading(false);
        }, 1200);
      };

      return (
        <div className="contact-form">
          <h2>Get In Touch</h2>
          <p className="subtitle">Have a project or question? Send me a message.</p>

          <form onSubmit={handleSubmit}>
            <div className="form-group">
              <label>Your Name</label>
              <input
                type="text"
                name="name"
                placeholder="John Doe"
                value={formData.name}
                onChange={handleChange}
              />
            </div>

            <div className="form-group">
              <label>Your Email</label>
              <input
                type="email"
                name="email"
                placeholder="john@example.com"
                value={formData.email}
                onChange={handleChange}
              />
            </div>

            <div className="form-group">
              <label>Your Message</label>
              <textarea
                name="message"
                placeholder="Tell me about your project..."
                value={formData.message}
                onChange={handleChange}
              ></textarea>
            </div>

            <button type="submit" disabled={loading}>
              {loading ? "Sending..." : "Send Message"}
            </button>
          </form>

          {status.message && (
            <div className={`status ${status.type}`}>
              {status.message}
            </div>
          )}

          <a href="index.html" className="back-link">← Back to Portfolio</a>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ContactForm />);
  </script>
</body>
</html>
